name: Sync YouTube playlist

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Expose bundled ffmpeg
        run: |
          mkdir -p "$HOME/bin"
          FFMPEG_PATH="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          ln -sf "$FFMPEG_PATH" "$HOME/bin/ffmpeg"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/ffmpeg" -version

      - name: Sync playlist
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
        run: |
          set +e
          python resolve_channels.py 2>&1 | tee sync.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -eq 0 ]; then
            python youtube_sync.py 2>&1 | tee -a sync.log
            STATUS=${PIPESTATUS[0]}
          fi

          if [ "$STATUS" -ne 0 ]; then
            if grep -Eqi "invalid_grant|Token has been expired or revoked|refresh.?token.*(expired|revoked)" sync.log; then
              echo "::error title=YouTube OAuth token expired or revoked::Generate a new refresh token and update the GitHub Secret YOUTUBE_REFRESH_TOKEN."
              echo ""
              echo "❌ YouTube OAuth token expired or was revoked."
              echo "Generate a new refresh token and update the GitHub Secret YOUTUBE_REFRESH_TOKEN."
            fi
            exit "$STATUS"
          fi

      - name: Save sync state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update YouTube sync state"
          git push
